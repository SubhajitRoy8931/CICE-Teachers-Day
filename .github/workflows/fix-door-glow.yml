name: Apply door glow fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-door-glow.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix glow layering
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "      transform: translate(-50%, -50%) scale(2.35);\n    }\n\n    .door-room img {",
                  "      transform: translate(-50%, -50%) scale(2.35);\n      z-index: 6;\n    }\n\n    .door-room img {",
              ),
              (
                  "      z-index: 4;\n      mix-blend-mode: screen;\n    }\n\n    /* The glow becomes overwhelming as the door opens. */",
                  "      z-index: 1;\n      mix-blend-mode: screen;\n    }\n\n    /* The glow stays behind the opaque door. */",
              ),
              (
                  "      z-index: 4;\n      animation: heavenlyPulse 1.05s ease-in-out infinite alternate;\n    }\n\n    @keyframes heavenlyPulse",
                  "      z-index: 2;\n      animation: heavenlyPulse 1.05s ease-in-out infinite alternate;\n    }\n\n    @keyframes heavenlyPulse",
              ),
          ]

          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix door glow layering"
          git push

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git rm .github/workflows/fix-door-glow.yml
          git commit -m "Remove temporary door glow fix workflow" || exit 0
          git push
