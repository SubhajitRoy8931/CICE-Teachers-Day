name: Redesign archive door

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/redesign-door.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace door design
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old_css = re.compile(
              r'    \.physical-door \{.*?    \.physical-lock\.unlocked::after \{.*?\n    \}',
              re.S,
          )

          new_css = '''    /* Dark double sliding classroom doors. */
          .physical-door {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(44vw, 570px);
            height: min(78vh, 790px);
            transform: translate(-50%, -50%);
            border: 1px solid #ffffff18;
            background: #111316;
            box-shadow: 0 35px 90px #000000b8;
            overflow: hidden;
            z-index: 3;
          }

          /* The two solid panels create the center opening. */
          .sliding-door-panel {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background:
              linear-gradient(90deg, #08090a 0%, #17191b 18%, #25282b 50%, #151719 82%, #090a0b 100%);
            box-shadow: inset 0 0 35px #00000075;
            transition: transform 3.3s cubic-bezier(.2,.78,.15,1);
            will-change: transform;
          }

          .sliding-door-left {
            left: 0;
            border-right: 1px solid #00000090;
          }

          .sliding-door-right {
            right: 0;
            border-left: 1px solid #00000090;
          }

          /* Subtle recessed panels make the doors feel physical. */
          .sliding-door-panel::before {
            content: "";
            position: absolute;
            inset: 8% 12%;
            border: 1px solid #ffffff10;
            box-shadow: inset 0 0 28px #00000055;
          }

          .sliding-door-panel::after {
            content: "";
            position: absolute;
            inset: 14% 20%;
            border: 1px solid #ffffff08;
          }

          /* Each panel slides away from the center. */
          .physical-door.open .sliding-door-left {
            transform: translateX(-102%);
          }

          .physical-door.open .sliding-door-right {
            transform: translateX(102%);
          }

          /* Keep the existing lock, centered between the two panels. */
          .physical-lock {
            position: absolute;
            left: 50%;
            top: 51%;
            width: 58px;
            height: 58px;
            transform: translate(-50%, -50%);
            border: 2px solid #9ea7ae;
            border-radius: 50%;
            background: #202428;
            box-shadow: 0 7px 18px #00000070;
            z-index: 5;
            transition: opacity .45s ease, transform .55s ease;
          }

          .physical-door.open .physical-lock {
            opacity: 0;
            pointer-events: none;
          }

          .physical-lock::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 5px;
            height: 26px;
            border-radius: 5px;
            background: #c0c7cc;
            transform: translate(-50%, -50%);
            transition: transform .55s ease;
          }

          .physical-lock.unlocked::after {
            transform: translate(-50%, -50%) rotate(90deg);
          }'''

          text, count = old_css.subn(new_css, text, count=1)
          if count != 1:
              raise SystemExit("Door CSS block was not found")

          old_html = '''          <div class="physical-door" id="physicalDoor">
            <div class="door-panel-large"></div>
            <div class="physical-lock" id="physicalLock"></div>
          </div>'''

          new_html = '''          <div class="physical-door" id="physicalDoor">
            <div class="sliding-door-panel sliding-door-left"></div>
            <div class="sliding-door-panel sliding-door-right"></div>
            <div class="physical-lock" id="physicalLock"></div>
          </div>'''

          if old_html not in text:
              raise SystemExit("Door HTML block was not found")
          text = text.replace(old_html, new_html, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit redesigned door
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign archive door as double sliding door"
          git push

      - name: Deploy redesigned site
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/redesign-door.yml
          git commit -m "Remove temporary door redesign workflow" || exit 0
          git push
